<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8">

    <meta name="twitter:description" content="Informations, filtres et ressources sur SWGOH.">
    <meta name="twitter:image" content="https://e-rimbault.github.io/swgoh-kit/image/logo_star_wars.png">

    <link rel="icon" type="image/png" href="image/logo_star_wars.png">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            color: #e0e6ed;
            text-align: center;
            background-color: #020208;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Nouveau Fond Étoilé Espace (Star Wars Theme) */
        .stars-background {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #0d1d31 0%, #020208 100%);
            overflow: hidden;
        }

        .stars-background::before, .stars-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, #ffe81f, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 230px 190px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 300px 60px, #4deeea, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 370px 150px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 450px 250px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 520px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 600px 180px, #ffe81f, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 650px 350px;
            opacity: 0.8;
            animation: twinkle 8s infinite linear;
        }

        .stars-background::after {
            background-size: 900px 500px;
            opacity: 0.5;
            animation: twinkle 14s infinite linear reverse;
        }

        @keyframes twinkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-350px); }
        }

        /* Header */
        header {
            font-size: 2.2rem;
            font-weight: bold;
            padding: 40px 10px 15px;
            letter-spacing: 2px;
            color: #ffffff; /* Jaune Star Wars */
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 232, 31, 0.5), 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* Language switch */
        .language-switcher {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 10;
        }

        .language-switcher img {
            width: 32px;
            cursor: pointer;
            margin-left: 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            transition: transform .2s, border-color .2s;
        }

        .language-switcher img:hover {
            transform: scale(1.1);
            border-color: #ffe81f;
        }

        /* CONTENEUR PRINCIPAL DISPOSÉ EN 3 COLONNES */
        .main-single-section {
            max-width: 1400px;
            margin: 0 auto 50px auto;
            padding: 25px;
            box-sizing: border-box;
            background: rgba(6, 11, 25, 0.75);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 212, 255, 0.05);

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        /* Conteneur de colonne */
        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Style des blocs individuels / Sous-sections */
        .section-block {
            background: rgba(12, 20, 36, 0.85);
            padding: 22px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            transition: transform .2s, box-shadow .2s, border-color .2s;
            box-sizing: border-box;
            text-align: center;
        }

        .section-block:hover {
            border-color: rgba(0, 212, 255, 0.6);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.2);
        }

        .section-block h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.25rem;
            letter-spacing: 1px;
            color: black; /* Jaune Star Wars pour les titres de sous-sections */
            background-color: white;
            text-decoration: underline !important;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 232, 31, 0.3);
        }

        .section-block a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            transition: color .2s, text-shadow .2s;
        }

        .section-block a:hover {
            color: #ffffff;
            text-decoration: underline;
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.8);
        }

        /* Séparateur en pointillés */
        .section-divider {
            border: none;
            border-top: 1px dashed rgba(0, 212, 255, 0.3);
            margin: 14px 0 10px 0;
        }

        /* Sous-titre de section */
        .section-subtitle {
            text-align: left;
            font-size: 0.82rem;
            font-weight: bold;
            color: #00d4ff;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* --- STYLES DES LISTES EN DESCENTE CONTINU --- */
        .dynamic-scroll-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: auto;
            max-height: none;
            overflow: visible;
        }

        /* Éléments Communs News & Unités */
        .news-item, .unit-item-link {
            background: rgba(255, 255, 255, 0.03);
            padding: 11px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            text-decoration: none;
            transition: background .2s, border-color .2s;
            box-sizing: border-box;
        }

        .unit-item-link {
            color: inherit;
        }

        .unit-item-link:hover {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.4);
        }

        .news-left, .unit-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .unit-left-content {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .unit-avatar {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .news-item-title-link {
            font-size: 0.9rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            transition: color .2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .unit-item-name {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffffff;
            transition: text-decoration .2s;
        }

        .unit-item-link:hover .unit-item-name {
            text-decoration: underline;
        }

        .news-item-title-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .news-item-author {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .news-item-date, .unit-item-date {
            font-size: 0.8rem;
            color: grey !important;
            font-weight: bold;
            white-space: nowrap;
        }

        .date-relative {
            color: #94a3b8;
            font-weight: normal;
        }

        .main-link-margin {
            display: inline-block;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        /* --- STYLES COMPACTS MODULE CURRENT ERA --- */
        .current-era-container {
            border: 1px solid rgba(0, 212, 255, 0.15);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
        }

        .current-era-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            color:purple;
            font-size: 0.95rem;
        }

        .current-era-icon {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .current-era-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            padding-right: 0;
        }

        .era-unit-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: inherit;
            transition: background .2s, border-color .2s, transform .2s;
        }

        .era-unit-card:hover {
            background: rgba(0, 212, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.5);
            transform: scale(1.02);
        }

        .era-unit-avatar {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .era-unit-name {
            font-size: 0.75rem;
            color: #ffffff;
            font-weight: bold;
            line-height: 1.2;
            text-align: center;
            word-break: break-word;
        }

        .era-unit-card:hover .era-unit-name {
            text-decoration: underline;
        }

        /* --- STYLES COMPACTS MODULE RAID --- */
        .featured-raid-container {
            border: 1px solid rgba(0, 212, 255, 0.15);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .featured-raid-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            transition: transform .2s;
            width: 100%;
        }

        .featured-raid-card:hover {
            transform: scale(1.02);
        }

        .featured-raid-image {
            max-width: 65px;
            height: auto;
            border-radius: 6px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        .featured-raid-name {
            font-size: 1.05rem;
            font-weight: bold;
            color: #00d4ff;
            transition: text-decoration .2s;
        }

        .featured-raid-card:hover .featured-raid-name {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .main-single-section {
                grid-template-columns: 1fr;
                padding: 15px;
                margin: 0 10px 30px 10px;
            }
            header {
                font-size: 1.6rem;
                padding: 50px 10px 15px;
            }
            .language-switcher {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

<!-- NOUVEAU FOND D'ÉCRAN ESPACE ÉTOILÉ STAR WARS -->
<div class="stars-background"></div>

    <div class="column">

            </div>

        <!-- Game -->
        <div class="section-block">

<script>
const translations = {
    en: {
        "title": "Star Wars Galaxy of Heroes Website",
        "character-title": "Character",
        "character-link": "Character Filter",
        "latest-units-subtitle": "Latest Units",
        "ship-title": "Ship",
        "ship-link": "Ships Filter",
        "latest-ships-subtitle": "Latest Ships",
        "era-title": "Era",
        "era-link": "Era List",
        "current-era-subtitle": "Current Era",
        "effect-title": "Buff / Debuff",
        "effect-link": "Effects Database",
        "news-section-title": "Latest News",
        "game-title": "Game",
        "game-link": "Game SWGOH Mini-games",
        "raid-title": "Raid",
        "raid-link": "Raid Dashboard",
        "featured-raid-subtitle": "Featured Raid",
        "loading": "Loading...",
        "error-news": "Error loading news",
        "error-units": "Error loading units",
        "error-ships": "Error loading ships",
        "error-eras": "Error loading eras",
        "error-raids": "Error loading raids",
        "by": "by",
        "days-ago": "days ago",
        "in-days": "In {x} days",
        "today": "Today"
    },
    fr: {
        "title": "Site Web Star Wars : Galaxy of Heroes",
        "character-title": "Personnages",
        "character-link": "Filtre Personnages",
        "latest-units-subtitle": "Dernières Unités",
        "ship-title": "Vaisseaux",
        "ship-link": "Filtre Vaisseaux",
        "latest-ships-subtitle": "Derniers Vaisseaux",
        "era-title": "Ere",
        "era-link": "Liste des Ères",
        "current-era-subtitle": "Ère Actuelle",
        "effect-title": "Bonus / Malus",
        "effect-link": "Base des Effets",
        "news-section-title": "Actualités",
        "game-title": "Jeu",
        "game-link": "Mini-jeux SWGOH",
        "raid-title": "Raid",
        "raid-link": "Tableau de Bord des Raids",
        "featured-raid-subtitle": "Raid Vedette",
        "loading": "Chargement...",
        "error-news": "Erreur lors du chargement des actualités",
        "error-units": "Erreur lors du chargement des unités",
        "error-ships": "Erreur lors du chargement des vaisseaux",
        "error-eras": "Erreur lors du chargement des ères",
        "error-raids": "Erreur lors du chargement des raids",
        "by": "par",
        "days-ago": "il y a {x} jours",
        "in-days": "Dans {x} jours",
        "today": "Aujourd'hui"
    }
};

let currentLang = "en";
let globalNewsData = [];
let globalUnitsData = [];
let globalShipsData = [];
let globalErasData = [];
let globalRaidsData = [];

window.onload = () => {
    currentLang = sessionStorage.getItem("selectedLanguage") || "en";
    switchLanguage(currentLang);
    loadNewsData();
    loadShipsData();
    loadUnitsData(); 
    loadRaidsData();
};

function switchLanguage(lang) {
    currentLang = lang;
    sessionStorage.setItem("selectedLanguage", lang);

    document.querySelectorAll("[id]").forEach(el => {
        if (translations[lang] && translations[lang][el.id]) {
            el.textContent = translations[lang][el.id];
        }
    });

    if (globalNewsData.length > 0) renderNews(globalNewsData);
    if (globalUnitsData.length > 0) renderUnits(globalUnitsData);
    if (globalShipsData.length > 0) renderShips(globalShipsData);
    if (globalErasData.length > 0 && globalUnitsData.length > 0) renderCurrentEra(globalErasData, globalUnitsData);
    if (globalRaidsData.length > 0) renderFeaturedRaid(globalRaidsData);
}

function processReleaseDate(dateString) {
    if (!dateString) return { html: '', isRelative: false };
    
    const parts = dateString.trim().split('-');
    if (parts.length !== 3) return { html: dateString, isRelative: false };

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    const releaseDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));

    const diffTime = today - releaseDate;
    const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays >= -6 && diffDays <= 6) {
        if (diffDays === 0) {
            return { html: `<span class="date-relative">${translations[currentLang]['today']}</span>`, isRelative: true };
        } else if (diffDays > 0) {
            let text = translations[currentLang]['days-ago'].replace('{x}', diffDays);
            if (currentLang === 'en') text = `${diffDays} days ago`; 
            return { html: `<span class="date-relative">${text}</span>`, isRelative: true };
        } else {
            let text = translations[currentLang]['in-days'].replace('{x}', Math.abs(diffDays));
            return { html: `<span class="date-relative">${text}</span>`, isRelative: true };
        }
    }

    const options = { month: 'long', day: '2-digit', year: 'numeric' };
    const formattedDate = releaseDate.toLocaleDateString(currentLang === 'fr' ? 'fr-FR' : 'en-US', options);
    return { html: formattedDate, isRelative: false };
}

/* --- MODULE PERSONNAGES --- */
function loadUnitsData() {
    const unitContainer = document.getElementById('unitList');
    if (unitContainer) unitContainer.innerHTML = `<div style="font-size:11px; color:#aaa;">${translations[currentLang]['loading']}</div>`;

    fetch('https://e-rimbault.github.io/swgoh-kit/filtre-recherche/units.json')
        .then(response => response.json())
        .then(data => {
            data.sort((a, b) => {
                const partsA = (a.release_date || "1970-01-01").trim().split('-');
                const partsB = (b.release_date || "1970-01-01").trim().split('-');
                const timeA = new Date(parseInt(partsA[0], 10), parseInt(partsA[1], 10) - 1, parseInt(partsA[2], 10)).getTime();
                const timeB = new Date(parseInt(partsB[0], 10), parseInt(partsB[1], 10) - 1, parseInt(partsB[2], 10)).getTime();
                return timeB - timeA;
            });
            globalUnitsData = data;
            renderUnits(data);
            
            if (globalErasData.length > 0) {
                renderCurrentEra(globalErasData, globalUnitsData);
            } else {
                loadErasData();
            }
        })
        .catch(error => {
            console.error("Erreur unités:", error);
            if (unitContainer) unitContainer.innerHTML = `<div style="font-size:11px;color:#ff4444;">${translations[currentLang]['error-units']}</div>`;
        });
}

function renderUnits(unitsData) {
    const unitContainer = document.getElementById('unitList');
    if (!unitContainer) return;
    unitContainer.innerHTML = '';

    const top20Units = unitsData.slice(0, 20);

    top20Units.forEach(unit => {
        const name = unit.name[currentLang] || unit.name['en'] || 'Unknown';
        const pageLink = unit.page || '#';
        const imgUrl = unit.image || '';
        const dateObj = processReleaseDate(unit.release_date);

        const unitHtml = `
            <a href="${pageLink}" class="unit-item-link">
                <div class="unit-left-content">
                    <img src="${imgUrl}" class="unit-avatar" alt="${name}" onerror="this.style.display='none';">
                    <div class="unit-left">
                        <div class="unit-item-name">${name}</div>
                        <div class="unit-item-date">${dateObj.html}</div>
                    </div>
                </div>
            </a>
        `;
        unitContainer.insertAdjacentHTML('beforeend', unitHtml);
    });
}

/* --- MODULE VAISSEAUX --- */
function loadShipsData() {
    const shipContainer = document.getElementById('shipList');
    if (shipContainer) shipContainer.innerHTML = `<div style="font-size:11px; color:#aaa;">${translations[currentLang]['loading']}</div>`;

    fetch('https://e-rimbault.github.io/swgoh-kit/filtre-recherche/ship.json')
        .then(response => response.json())
        .then(data => {
            data.sort((a, b) => {
                const partsA = (a.release_date || "1970-01-01").trim().split('-');
                const partsB = (b.release_date || "1970-01-01").trim().split('-');
                const timeA = new Date(parseInt(partsA[0], 10), parseInt(partsA[1], 10) - 1, parseInt(partsA[2], 10)).getTime();
                const timeB = new Date(parseInt(partsB[0], 10), parseInt(partsB[1], 10) - 1, parseInt(partsB[2], 10)).getTime();
                return timeB - timeA;
            });
            globalShipsData = data;
            renderShips(data);
        })
        .catch(error => {
            console.error("Erreur vaisseaux:", error);
            if (shipContainer) shipContainer.innerHTML = `<div style="font-size:11px;color:#ff4444;">${translations[currentLang]['error-ships']}</div>`;
        });
}

function renderShips(shipsData) {
    const shipContainer = document.getElementById('shipList');
    if (!shipContainer) return;
    shipContainer.innerHTML = '';

    const top20Ships = shipsData.slice(0, 20);

    top20Ships.forEach(ship => {
        const name = ship.name[currentLang] || ship.name['en'] || 'Unknown';
        const pageLink = ship.page || '#';
        const imgUrl = ship.image || '';
        const dateObj = processReleaseDate(ship.release_date);

        const shipHtml = `
            <a href="${pageLink}" class="unit-item-link">
                <div class="unit-left-content">
                    <img src="${imgUrl}" class="unit-avatar" alt="${name}" onerror="this.style.display='none';">
                    <div class="unit-left">
                        <div class="unit-item-name">${name}</div>
                        <div class="unit-item-date">${dateObj.html}</div>
                    </div>
                </div>
            </a>
        `;
        shipContainer.insertAdjacentHTML('beforeend', shipHtml);
    });
}

/* --- MODULE RAIDS --- */
function loadRaidsData() {
    const raidContainer = document.getElementById('featuredRaidContainer');
    if (raidContainer) raidContainer.innerHTML = `<div style="font-size:11px; color:#aaa;">${translations[currentLang]['loading']}</div>`;

    fetch('https://e-rimbault.github.io/swgoh-kit/raid/raid.html')
        .then(response => response.text())
        .then(htmlText => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            
            const scripts = doc.querySelectorAll('script');
            let raidsData = null;

            scripts.forEach(script => {
                const content = script.textContent;
                if (content && content.includes('Krayt Dragon Hunt')) {
                    try {
                        const match = content.match(/\[\s*\{\s*id[\s\S]*?\}\s*\]/);
                        if (match) {
                            let jsonString = match[0]
                                .replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":')
                                .replace(/'/g, '"')
                                .replace(/,\s*\]/g, ']');

                            raidsData = JSON.parse(jsonString);
                        }
                    } catch (e) {
                        console.error("Erreur lors de l'extraction des raids du script :", e);
                    }
                }
            });

            if (raidsData && raidsData.length > 0) {
                globalRaidsData = raidsData;
                renderFeaturedRaid(raidsData);
            } else {
                throw new Error("Données de raid introuvables dans le HTML");
            }
        })
        .catch(error => {
            console.error("Erreur raids:", error);
            if (raidContainer) raidContainer.innerHTML = `<div style="font-size:11px;color:#ff4444;">${translations[currentLang]['error-raids']}</div>`;
        });
}

function renderFeaturedRaid(raidsData) {
    const raidContainer = document.getElementById('featuredRaidContainer');
    if (!raidContainer || raidsData.length === 0) return;

    const sortedRaids = [...raidsData].sort((a, b) => b.id - a.id);
    const featuredRaid = sortedRaids[0];

    const name = featuredRaid.name[currentLang] || featuredRaid.name['en'] || 'Unknown Raid';
    const imgUrl = featuredRaid.image || '';
    const pageUrl = featuredRaid.url ? `https://e-rimbault.github.io/swgoh-kit/raid/${featuredRaid.url}` : '#';

    raidContainer.innerHTML = `
        <a href="${pageUrl}" class="featured-raid-card">
            <img src="${imgUrl}" class="featured-raid-image" alt="${name}" onerror="this.style.display='none';">
            <div class="featured-raid-name">${name}</div>
        </a>
    `;
}

/* --- MODULE ERAS --- */
function loadErasData() {
    const headerContainer = document.getElementById('currentEraHeader');
    if (headerContainer) {
        headerContainer.innerHTML = `<span style="font-size:11px; color:#aaa;">${translations[currentLang]['loading']}</span>`;
    }

    fetch('https://e-rimbault.github.io/swgoh-kit/filtre-recherche/eras.json')
        .then(response => response.json())
        .then(data => {
            globalErasData = data;
            renderCurrentEra(data, globalUnitsData);
        })
        .catch(error => {
            console.error("Erreur ères:", error);
            if (headerContainer) {
                headerContainer.innerHTML = `<span style="color:#ff4444; font-size:11px;">${translations[currentLang]['error-eras']}</span>`;
            }
        });
}

function renderCurrentEra(erasData, unitsData) {
    const headerContainer = document.getElementById('currentEraHeader');
    const gridContainer = document.getElementById('currentEraGrid');
    if (!headerContainer || !gridContainer || !erasData || erasData.length === 0) return;

    const currentEra = erasData.reduce((maxEra, era) => {
        const currentNum = Number(era.numero_ere || era.id) || 0;
        const maxNum = Number(maxEra.numero_ere || maxEra.id) || 0;
        return currentNum > maxNum ? era : maxEra;
    }, erasData[0]);

    if (!currentEra) {
        headerContainer.innerHTML = '';
        return;
    }

    const eraName = currentLang === 'fr' 
        ? (currentEra.name_fr || currentEra.name_en) 
        : (currentEra.name_en || currentEra.name_fr);
        
    const eraImage = currentEra.image || '';

    headerContainer.innerHTML = `
        <img src="${eraImage}" class="current-era-icon" alt="" onerror="this.style.display='none';">
        <span>${eraName}</span>
    `;

    gridContainer.innerHTML = '';
    
    const targetEraEn = (currentEra.name_en || '').trim().toLowerCase();
    const targetEraFr = (currentEra.name_fr || '').trim().toLowerCase();
    const targetEraNum = Number(currentEra.numero_ere || currentEra.id);

    const filteredUnits = (unitsData || []).filter(unit => {
        let unitEraEn = '';
        let unitEraFr = '';

        if (unit.era && typeof unit.era === 'object') {
            unitEraEn = unit.era.en || unit.era.name_en || '';
            unitEraFr = unit.era.fr || unit.era.name_fr || '';
        } else {
            unitEraEn = typeof unit.era === 'string' ? unit.era : '';
            unitEraFr = typeof unit.ere === 'string' ? unit.ere : '';
        }

        unitEraEn = unitEraEn.trim().toLowerCase();
        unitEraFr = unitEraFr.trim().toLowerCase();

        const matchEn = targetEraEn !== '' && unitEraEn === targetEraEn;
        const matchFr = targetEraFr !== '' && unitEraFr === targetEraFr;
        
        const unitNum = unit.numero_ere || unit.era_id;
        const matchNum = unitNum && (Number(unitNum) === targetEraNum);

        return matchEn || matchFr || matchNum;
    });

    if (filteredUnits.length === 0) {
        const noUnitsText = (translations[currentLang] && translations[currentLang]['no-units']) 
            ? translations[currentLang]['no-units'] 
            : (currentLang === 'fr' ? 'Aucune unité trouvée' : 'No units found');

        gridContainer.innerHTML = `<div style="grid-column: 1 / -1; font-size:11px; color:#aaa; padding:10px;">${noUnitsText}</div>`;
        return;
    }

    filteredUnits.forEach(unit => {
        let uName = 'Unknown';
        if (unit.name && typeof unit.name === 'object') {
            uName = unit.name[currentLang] || unit.name['en'] || unit.name['fr'] || 'Unknown';
        } else if (typeof unit.name === 'string') {
            uName = unit.name;
        }

        const uImg = unit.image || '';
        
        let uPage = unit.page || '#';
        if (uPage !== '#' && !uPage.startsWith('http') && !uPage.startsWith('/') && !uPage.startsWith('filtre-recherche/')) {
            uPage = 'filtre-recherche/' + uPage;
        }

        const cardHtml = `
            <a href="${uPage}" class="era-unit-card">
                <img src="${uImg}" class="era-unit-avatar" alt="${uName}" onerror="this.style.display='none';">
                <div class="era-unit-name">${uName}</div>
            </a>
        `;
        gridContainer.insertAdjacentHTML('beforeend', cardHtml);
    });
}

/* --- MODULE NEWS --- */
function loadNewsData() {
    const newsContainer = document.getElementById('newsList');
    if(newsContainer) newsContainer.innerHTML = `<div style="font-size:11px; color:#aaa;">${translations[currentLang]['loading']}</div>`;

    fetch('https://e-rimbault.github.io/swgoh-kit/filtre-recherche/new.json')
        .then(response => response.json())
        .then(data => {
            data.sort((a, b) => b.id - a.id);
            globalNewsData = data;
            renderNews(data);
        })
        .catch(error => {
            console.error("Erreur news:", error);
            if(newsContainer) newsContainer.innerHTML = `<div style="font-size:11px;color:#ff4444;">${translations[currentLang]['error-news']}</div>`;
        });
}

function formatNewsDate(dateString) {
    if (!dateString) return '';
    const parts = dateString.trim().split('-');
    if (parts.length !== 3) return dateString;

    const dateObj = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    const options = { month: 'long', day: '2-digit', year: 'numeric' };
    return dateObj.toLocaleDateString(currentLang === 'fr' ? 'fr-FR' : 'en-US', options);
}

function renderNews(newsData) {
    const newsContainer = document.getElementById('newsList');
    if (!newsContainer) return;
    newsContainer.innerHTML = '';

    const top10news = newsData.slice(0, 10);

    top10news.forEach(news => {
        const title = news.title || 'No Title';
        const link = news.link || '#';
        const author = news.author || 'Unknown';
        const formattedDate = formatNewsDate(news.news_date);

        const newsHtml = `
            <div class="news-item">
                <div class="news-left">
                    <a href="${link}" target="_blank" class="news-item-title-link">
                        ${title} 🔗
                    </a>
                    <span class="news-item-author">${translations[currentLang]['by']} ${author}</span>
                </div>
                <div class="news-item-date">${formattedDate}</div>
            </div>
        `;
        newsContainer.insertAdjacentHTML('beforeend', newsHtml);
    });
}
